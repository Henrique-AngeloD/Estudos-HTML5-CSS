<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner{
            background-color: lightblue;
            display: flex;

            flex-flow: row nowrap
        }
        div.item{
            background-color: rgb(94, 229, 94);
            border: 1px solid black;
            text-align: center;
            flex-basis: 150px;
        }

        div#i1{
            flex-shrink: 1;
            flex-grow: 0;
        }

        div#i2{
            flex-shrink: 1;
            flex-grow: 3;
        }

        div#i3{
            flex-shrink: 1;
            flex-grow: 9;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div id="i1" class="item">A</div>
        <div id="i2" class="item">B</div>
        <div id="i3" class="item">C</div>
    </div>
</body>
</html>
